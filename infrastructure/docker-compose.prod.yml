# Prédio ON em produção, numa VPS.
#
#   cp infrastructure/.env.prod.example infrastructure/.env.prod
#   # edite as senhas e o domínio
#   bash infrastructure/setup-prod.sh
#
# Só o Caddy expõe porta para a internet (80/443), mais a 8883 do broker para os gateways.
# Banco e API ficam apenas na rede interna do compose.

name: predioon

x-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: timescale/timescaledb:2.30.1-pg16
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: predioon
      POSTGRES_USER: predioon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predioon -d predioon"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Os scripts NÃO entram no initdb: eles dependem das tabelas que o Drizzle cria.
      # Quem os aplica, na ordem certa, é infrastructure/setup-prod.sh.

  emqx:
    image: emqx/emqx:6.3.1
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_TLS_PORT:-8883}:8883"
    environment:
      EMQX_NAME: predioon
      # Sem isto a sessão da ingestão vive só na memória do broker: reiniciar o EMQX perde as
      # leituras QoS 1 ainda não confirmadas. Ensaio em docs/INBOX_DECISOES.md.
      EMQX_DURABLE_SESSIONS__ENABLE: "true"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?defina EMQX_DASHBOARD_PASSWORD}
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__CACHE__ENABLE: "false"
      EMQX_AUTHENTICATION: >-
        [{mechanism = password_based, backend = http, method = post,
        url = "http://api:3000/internal/mqtt/authn",
        headers = {"content-type" = "application/json", "x-mqtt-secret" = "${MQTT_AUTH_SECRET:?defina MQTT_AUTH_SECRET}"},
        body = {username = "$${username}", password = "$${password}", clientid = "$${clientid}"}}]
      EMQX_AUTHORIZATION__SOURCES: >-
        [{type = http, method = post, url = "http://api:3000/internal/mqtt/authz",
        headers = {"content-type" = "application/json", "x-mqtt-secret" = "${MQTT_AUTH_SECRET}"},
        body = {username = "$${username}", clientid = "$${clientid}", action = "$${action}", topic = "$${topic}"}}]
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/site/fullchain.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/site/privkey.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERSIONS: '["tlsv1.3", "tlsv1.2"]'
      EMQX_LISTENERS__WS__DEFAULT__ENABLE: "false"
      EMQX_LISTENERS__WSS__DEFAULT__ENABLE: "false"
    volumes:
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx_data:/opt/emqx/data
      - ${MQTT_CERTS_DIR:?defina MQTT_CERTS_DIR}:/opt/emqx/etc/certs/site:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s

  api:
    build: &api-build
      context: ..
      dockerfile: infrastructure/Dockerfile.node
      args:
        SERVICE: api
    restart: unless-stopped
    logging: *bounded-logs
    working_dir: /app/apps/api
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment: &api-environment
      API_PORT: 3000
      NODE_ENV: production
      DATABASE_URL_APP: postgres://predioon_app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_IDENTITY: postgres://predioon_identity:${IDENTITY_DB_PASSWORD:?defina IDENTITY_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_BROKER_AUTH: postgres://predioon_broker_auth:${BROKER_AUTH_DB_PASSWORD:?defina BROKER_AUTH_DB_PASSWORD}@db:5432/predioon
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?defina JWT_ACTIVE_KID}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?defina JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:?defina JWT_PUBLIC_KEYS}
      JWT_ACCESS_TTL_MINUTES: 5
      JWT_REFRESH_TTL_DAYS: 30
      AUTH_RATE_LIMIT_KEY: ${AUTH_RATE_LIMIT_KEY:?defina AUTH_RATE_LIMIT_KEY}
      # Opcional: sem ela a verificação em duas etapas fica indisponível para novas ativações.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # Opcional: sem ela a abertura pelo QR do totem fica indisponível.
      GATE_QR_SECRET: ${GATE_QR_SECRET:-}
      # Opcionais: sem a chave do Resend nenhum e-mail é enviado.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      RESIDENT_PORTAL_URL: ${RESIDENT_PORTAL_URL:-}
      # Trust only the concrete Caddy peer, never the default application network.
      TRUST_PROXY_CIDRS: ${PROXY_IPV4_ADDRESS:-172.30.250.2}/32
      MQTT_AUTH_SECRET: ${MQTT_AUTH_SECRET}
      MQTT_INGEST_USERNAME: ${MQTT_INGEST_USERNAME:-predioon_ingest}
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD}
      CORS_ORIGINS: https://admin.${DOMAIN},https://sindico.${DOMAIN},https://morador.${DOMAIN}
    # Ready only when the restricted database logins answer (/health/ready).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
      edge_proxy:
        # Reserve both peers: otherwise Docker may dynamically assign Caddy's
        # .2 address to the API before the web service starts.
        ipv4_address: ${API_PROXY_IPV4_ADDRESS:-172.30.250.3}

  ingest:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.node
      args:
        SERVICE: ingest
    restart: unless-stopped
    logging: *bounded-logs
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      # Only this workload's two restricted logins; never the owner or another service's.
      NODE_ENV: production
      DATABASE_URL_INGEST: postgres://predioon_ingest:${INGEST_DB_PASSWORD:?defina INGEST_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_ACCESS_SERVICE: postgres://predioon_access_service:${ACCESS_SERVICE_DB_PASSWORD:?defina ACCESS_SERVICE_DB_PASSWORD}@db:5432/predioon
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: ${MQTT_INGEST_USERNAME:-predioon_ingest}
      MQTT_PASSWORD: ${MQTT_INGEST_PASSWORD:?defina MQTT_INGEST_PASSWORD}
      MQTT_CLIENT_ID: predioon-ingest
      GATEWAY_OFFLINE_TIMEOUT_SECONDS: 180
      DEVICE_OFFLINE_TIMEOUT_SECONDS: 600
    working_dir: /app/services/ingest
    # Healthy only while the MQTT session is connected and the database answers (heartbeat every 10 s).
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/health.ts"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  notifications:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.node
      args:
        SERVICE: notifications
    restart: unless-stopped
    logging: *bounded-logs
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    working_dir: /app/services/notifications
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_NOTIFICATIONS: postgres://predioon_notifications:${NOTIFICATIONS_DB_PASSWORD:?defina NOTIFICATIONS_DB_PASSWORD}@db:5432/predioon
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/health.ts"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_RESIDENT_URL: https://morador.${DOMAIN}
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Caddy's local admin endpoint answers only inside the container.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      edge_proxy:
        ipv4_address: ${PROXY_IPV4_ADDRESS:-172.30.250.2}

  # Explicitly invoked only by setup-prod.sh/administrative commands. Never
  # included in ordinary `up`; owner credentials never reach runtime services.
  db-admin:
    profiles: [maintenance]
    build: *api-build
    restart: "no"
    working_dir: /app/packages/db
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *api-environment
      DATABASE_URL: postgres://predioon:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/predioon
      DATABASE_URL_APP: postgres://predioon_app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_IDENTITY: postgres://predioon_identity:${IDENTITY_DB_PASSWORD:?defina IDENTITY_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_BROKER_AUTH: postgres://predioon_broker_auth:${BROKER_AUTH_DB_PASSWORD:?defina BROKER_AUTH_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_NOTIFICATIONS: postgres://predioon_notifications:${NOTIFICATIONS_DB_PASSWORD:?defina NOTIFICATIONS_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_INGEST: postgres://predioon_ingest:${INGEST_DB_PASSWORD:?defina INGEST_DB_PASSWORD}@db:5432/predioon
      DATABASE_URL_ACCESS_SERVICE: postgres://predioon_access_service:${ACCESS_SERVICE_DB_PASSWORD:?defina ACCESS_SERVICE_DB_PASSWORD}@db:5432/predioon
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    command: [pnpm, --filter, "@predioon/db", "db:infra", --check]

networks:
  default:
  # Only Caddy and the API join this network. The API exposes no host port.
  edge_proxy:
    ipam:
      config:
        - subnet: ${PROXY_NETWORK_CIDR:-172.30.250.0/29}

volumes:
  pg_data:
  emqx_data:
  caddy_data:
  caddy_config:
