%% Prédio ON — ACL do EMQX.
%%
%% Monte este arquivo em /opt/emqx/etc/acl.conf. A ordem importa: a primeira regra
%% que casar decide, e a última linha nega tudo o que não foi liberado acima.
%%
%% Camadas de proteção, de fora para dentro:
%%   1. aqui: quem pode publicar/assinar qual formato de tópico
%%   2. ingest: o payload precisa bater com o tópico (services/ingest/src/pipeline/telemetry.ts)
%%   3. ingest: o dispositivo precisa estar cadastrado naquele prédio
%%   4. banco: RLS impede que um usuário leia dados de outro prédio

%% O serviço de ingestão apenas assina. Ele nunca publica no barramento de campo.
{allow, {user, "predioon_ingest"}, subscribe, ["predio/+/device/+/telemetry", "predio/+/gateway/+/status"]}.
{deny,  {user, "predioon_ingest"}, publish, ["#"]}.

%% Gateways: credencial própria no formato gw_<gatewayId>, emitida pelo painel administrador.
%% Só podem publicar telemetria e o próprio status — nunca assinar nada.
{allow, {username, {re, "^gw_.+$"}}, publish, ["predio/+/device/+/telemetry", "predio/+/gateway/+/status"]}.
{deny,  {username, {re, "^gw_.+$"}}, subscribe, ["#"]}.

%% Nada além do que está acima.
{deny, all}.

%% PRÓXIMO PASSO DE ENDURECIMENTO
%% As regras acima permitem que um gateway publique sob o prefixo de qualquer prédio;
%% quem barra isso hoje é a camada 3 (o dispositivo precisa existir naquele prédio).
%% Para barrar já no broker, configure o autorizador HTTP do EMQX apontando para a API,
%% que sabe a qual prédio cada gateway pertence:
%%
%%   authorization.sources = [{ type = http, method = post,
%%                              url = "https://SUA-API/mqtt/authz",
%%                              body = { username = "${username}", topic = "${topic}", action = "${action}" } }]
