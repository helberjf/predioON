services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: predioon
      POSTGRES_USER: predioon
      POSTGRES_PASSWORD: predioon
    ports:
      # 5434 no host: 5432 e 5433 costumam já estar ocupadas por outros projetos.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predioon -d predioon"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - predioon_pg:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:latest
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_NAME: predioon
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public-change-me

volumes:
  predioon_pg:
