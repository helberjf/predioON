services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: predioon
      POSTGRES_USER: predioon
      POSTGRES_PASSWORD: predioon
    ports:
      - "5433:5432"
    volumes:
      - predioon_pg:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:latest
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_NAME: predioon
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public-change-me

volumes:
  predioon_pg:
