name: Workflow semantic validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax, expressions and available contexts
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="${RUNNER_TEMP}/predioon-actionlint"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location --max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$lint_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes=
