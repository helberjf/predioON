name: Android emulator smoke

on:
  push:
    branches: [main]
    paths:
      - 'apps/*-mobile/**'
      - 'packages/mobile/**'
      - 'packages/api-client/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - 'scripts/android-smoke/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        app: [resident-mobile, operations-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: pnpm install --frozen-lockfile
      - name: Check smoke assertions without an emulator
        run: python3 -m unittest discover -s scripts/android-smoke -p 'test_*.py' -v
      - name: Configure reserved API origin in disposable checkout
        run: python3 scripts/android-smoke/prepare.py configure --app ${{ matrix.app }}
      - name: Build bundled release for emulator architecture
        working-directory: apps/${{ matrix.app }}/android
        run: bash gradlew --no-daemon --refresh-dependencies :app:assembleRelease -PreactNativeArchitectures=x86_64
      - name: Sign emulator copy with an ephemeral verification key
        run: >-
          python3 scripts/android-smoke/prepare.py sign --app ${{ matrix.app }}
          --apk apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release-unsigned.apk
          --output .local/android-smoke/${{ matrix.app }}/verification.apk
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch, inspect and resume the installed application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/android-smoke/run.py --app ${{ matrix.app }} --apk .local/android-smoke/${{ matrix.app }}/verification.apk --artifacts .local/android-smoke/${{ matrix.app }}/evidence
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ matrix.app }}-${{ github.run_id }}
          path: |
            .local/android-smoke/${{ matrix.app }}/build.json
            .local/android-smoke/${{ matrix.app }}/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
