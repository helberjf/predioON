name: Browser workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: predioon
          POSTGRES_PASSWORD: predioon
          POSTGRES_DB: predioon
          TIMESCALEDB_TELEMETRY: 'off'
        ports: ['5436:5432']
        options: >-
          --health-cmd "pg_isready -U predioon -d predioon"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://predioon:predioon@localhost:5436/predioon
      DATABASE_URL_APP: postgres://predioon_app:predioon_app@localhost:5436/predioon
      DATABASE_URL_IDENTITY: postgres://predioon_identity:predioon_identity@localhost:5436/predioon
      DATABASE_URL_BROKER_AUTH: postgres://predioon_broker_auth:predioon_broker_auth@localhost:5436/predioon
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable database for real browser workflows
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          pnpm db:bootstrap
          for script in infrastructure/[0-9]*.sql; do
            transaction=()
            number="${script##*/}"
            if (( 10#${number%%-*} >= 15 )); then transaction=(--single-transaction); fi
            docker exec -i "$PG_CONTAINER" psql -U predioon -d predioon -v ON_ERROR_STOP=1 "${transaction[@]}" -f - < "$script"
          done
          pnpm db:provision-runtime
          pnpm db:seed
      - name: Install browser and operating system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise all three portals against the real API
        run: pnpm test:e2e
      - name: Preserve report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            .local/playwright-results/
            .local/playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
