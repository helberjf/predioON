name: Browser workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # One job per engine, each with its own disposable database: the suite keeps one worker
    # and zero retries, so splitting by engine is what keeps the wall time under the limit.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Match the owner of GitHub's mounted home/workspace; Firefox refuses a
      # root process using the runner's home. Keep the same official image.
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: predioon
          POSTGRES_PASSWORD: predioon
          POSTGRES_DB: predioon
          TIMESCALEDB_TELEMETRY: 'off'
        options: >-
          --health-cmd "pg_isready -U predioon -d predioon"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_SERVICE: postgres
      DATABASE_URL: postgres://predioon:predioon@postgres:5432/predioon
      DATABASE_URL_APP: postgres://predioon_app:predioon_app@postgres:5432/predioon
      DATABASE_URL_IDENTITY: postgres://predioon_identity:predioon_identity@postgres:5432/predioon
      DATABASE_URL_BROKER_AUTH: postgres://predioon_broker_auth:predioon_broker_auth@postgres:5432/predioon
      DATABASE_URL_NOTIFICATIONS: postgres://predioon_notifications:predioon_notifications@postgres:5432/predioon
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify disposable database guards, stable selectors and matching browser image
        run: |
          node --experimental-strip-types --test e2e/support/database-target.test.ts
          node scripts/check-e2e-selectors.mjs
          node -e "if (require('@playwright/test/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image together with the package')"
      - name: Prepare disposable database for real browser workflows
        run: |
          pnpm db:bootstrap
          pnpm db:infra
          pnpm db:infra
          pnpm db:provision-runtime
          SEED_PHYSICAL_FEATURES=enabled pnpm db:seed
      - name: Preserve pages and drafts when returning to the browser
        if: matrix.browser == 'chromium'
        run: pnpm test:e2e:focus
      - name: Exercise all three portals against the real API
        run: pnpm test:e2e --project=${{ matrix.browser }}
      - name: Preserve report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ matrix.browser }}
          path: |
            .local/playwright-results/
            .local/playwright-report/
            .local/focus-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
