name: Native Android verification

on:
  push:
    branches: [main]
    paths:
      - 'apps/*-mobile/**'
      - 'packages/mobile/**'
      - 'packages/api-client/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [resident-mobile, operations-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: pnpm install --frozen-lockfile
      - name: Verify official dependency repository availability
        run: |
          for artifact in org/jetbrains/kotlin/kotlin-stdlib/2.3.0/kotlin-stdlib-2.3.0.pom org/jetbrains/kotlin/kotlin-gradle-plugins-bom/2.2.0/kotlin-gradle-plugins-bom-2.2.0.pom io/github/java-diff-utils/java-diff-utils/4.15/java-diff-utils-4.15.pom; do
            curl --fail --retry 3 --retry-all-errors --output /dev/null "https://repo.maven.apache.org/maven2/$artifact"
          done
      - name: Compile Android application and bundled JavaScript
        working-directory: apps/${{ matrix.app }}/android
        run: bash gradlew --no-daemon --refresh-dependencies --info :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Preserve unsigned verification build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-unsigned-android
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
